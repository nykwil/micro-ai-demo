<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Micro-AI Survival</title>
    <style>
      * { box-sizing: border-box; }
      html, body { 
        margin: 0; 
        padding: 0;
        overflow: hidden; 
        background-color: #111; 
        color: white; 
        font-family: sans-serif;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        height: 100%;
        width: 100%;
      }
      #ui { 
        position: absolute; 
        top: 40px; 
        left: 50%;
        transform: translateX(-50%);
        z-index: 10; 
        background: rgba(0,0,0,0.7); 
        padding: 8px 16px; 
        border-radius: 8px; 
        pointer-events: none;
        text-align: center;
        max-width: 90%;
      }
      #ui h1 {
        font-size: 16px;
        margin: 0 0 4px 0;
      }
      #ui .instructions {
        font-size: 11px;
        opacity: 0.8;
      }
      .legend { 
        margin-top: 8px; 
        display: flex; 
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px; 
        font-size: 10px; 
      }
      .legend-item {
        display: flex;
        align-items: center;
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
      }
      button { 
        cursor: pointer; 
        padding: 12px 16px; 
        background: #444; 
        border: none; 
        color: white; 
        border-radius: 8px;
        font-size: 14px;
        touch-action: manipulation;
      }
      button:active { 
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div id="error-display" style="display: none; position: fixed; top: 0; left: 0; width: 100%; background: red; color: white; padding: 20px; z-index: 9999; font-family: monospace; white-space: pre-wrap;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const el = document.getElementById('error-display');
        el.style.display = 'block';
        el.textContent += `Error: ${message}\nSource: ${source}:${lineno}:${colno}\n\n`;
      };
      window.addEventListener('unhandledrejection', function(event) {
        const el = document.getElementById('error-display');
        el.style.display = 'block';
        el.textContent += `Promise Rejection: ${event.reason}\n\n`;
      });
    </script>
    <div id="ui">
      <h1>Micro-AI Survival</h1>
      <div class="instructions">Touch to aim. Auto-Move enabled by default.</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background: red;"></span>Chase</div>
        <div class="legend-item"><span class="legend-dot" style="background: yellow;"></span>Orbit</div>
        <div class="legend-item"><span class="legend-dot" style="background: lime;"></span>Wander</div>
        <div class="legend-item"><span class="legend-dot" style="background: #aa00ff;"></span>Flee</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
